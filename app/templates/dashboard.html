<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SOCKS5 Admin Panel</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    .topbar {
      background: #1a1d27; padding: 16px 32px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2d3148;
    }
    .topbar h1 { font-size: 20px; color: #7c6af7; font-weight: 700; letter-spacing: 1px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .login-overlay {
      position: fixed; inset: 0; background: #0f1117;
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .login-box {
      background: #1a1d27; padding: 40px; border-radius: 12px;
      width: 360px; border: 1px solid #2d3148;
    }
    .login-box h2 { color: #7c6af7; margin-bottom: 24px; text-align: center; }
    .login-box input {
      width: 100%; padding: 12px; margin-bottom: 14px;
      background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
      color: #e2e8f0; font-size: 14px;
    }
    .btn {
      padding: 10px 20px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #7c6af7; color: #fff; width: 100%; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-success { background: #22c55e; color: #fff; }
    .btn-warning { background: #f59e0b; color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .container { padding: 24px 32px; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px;
    }
    .stat-card {
      background: #1a1d27; border-radius: 12px; padding: 20px;
      border: 1px solid #2d3148;
    }
    .stat-card .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #7c6af7; margin-top: 6px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card {
      background: #1a1d27; border-radius: 12px; padding: 20px;
      border: 1px solid #2d3148;
    }
    .card h3 { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }

    .proxy-string {
      background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
      padding: 12px 16px; font-family: monospace; font-size: 14px;
      color: #22c55e; word-break: break-all; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .copy-btn {
      background: #2d3148; border: none; color: #e2e8f0; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .copy-btn:hover { background: #7c6af7; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; color: #94a3b8; border-bottom: 1px solid #2d3148; font-weight: 600; }
    td { padding: 10px 12px; border-bottom: 1px solid #1e2235; }
    tr:hover td { background: #1e2235; }

    .badge {
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-green { background: #14532d; color: #22c55e; }
    .badge-red { background: #450a0a; color: #ef4444; }
    .badge-yellow { background: #451a03; color: #f59e0b; }
    .badge-blue { background: #1e3a5f; color: #60a5fa; }

    .event-log {
      max-height: 280px; overflow-y: auto; font-size: 12px;
    }
    .event-item {
      padding: 8px 12px; border-bottom: 1px solid #1e2235;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .event-time { color: #64748b; white-space: nowrap; }
    .event-msg { color: #e2e8f0; }
    .event-rotation { color: #f59e0b; }
    .event-block { color: #ef4444; }
    .event-connect { color: #22c55e; }

    .alert-banner {
      background: #450a0a; border: 1px solid #ef4444; border-radius: 8px;
      padding: 12px 16px; margin-bottom: 16px; display: none;
      color: #ef4444; font-weight: 600;
    }

    .add-user-form { display: flex; gap: 10px; margin-bottom: 16px; }
    .add-user-form input {
      flex: 1; padding: 10px; background: #0f1117;
      border: 1px solid #2d3148; border-radius: 8px; color: #e2e8f0; font-size: 13px;
    }

    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #22c55e; color: #fff; padding: 12px 20px;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      display: none; z-index: 999;
    }
  </style>
</head>
<body>

<!-- Login Overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>🔐 SOCKS5 Admin</h2>
    <input type="text" id="loginUser" placeholder="Username" />
    <input type="password" id="loginPass" placeholder="Password" />
    <p id="loginError" style="color:#ef4444;font-size:12px;margin-bottom:10px;"></p>
    <button class="btn btn-primary" onclick="doLogin()">Login</button>
  </div>
</div>

<!-- Top Bar -->
<div class="topbar">
  <h1>⚡ SOCKS5 Proxy Admin</h1>
  <div>
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText" style="font-size:13px;color:#94a3b8;">Connecting...</span>
    <button class="btn btn-danger btn-sm" style="margin-left:16px;" onclick="logout()">Logout</button>
  </div>
</div>

<!-- Alert Banner -->
<div class="container">
  <div class="alert-banner" id="alertBanner"></div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Public IP</div>
      <div class="value" id="statIP" style="font-size:16px;margin-top:8px;">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Proxy Port</div>
      <div class="value" id="statPort">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Users</div>
      <div class="value" id="statUsers">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Blocked IPs</div>
      <div class="value" id="statBlocked" style="color:#ef4444;">—</div>
    </div>
  </div>

  <div class="grid-2">
    <!-- Users Panel -->
    <div class="card">
      <h3>Proxy Users</h3>
      <div style="margin-bottom:16px;">
        <button class="btn btn-success" onclick="addUser(event)">+ Add User</button>
        <span style="font-size:12px;color:#64748b;margin-left:10px;">Username, password & port auto-generated</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Status</th>
            <th>Connections</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>

    <!-- Events Log -->
    <div class="card">
      <h3>Live Event Log</h3>
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>

  <!-- Proxy Credentials -->
  <div class="card" style="margin-bottom:20px;">
    <h3>Proxy Credentials — Copy & Send to Brother</h3>
    <div id="proxyStrings"></div>
  </div>
</div>

<div id="toast"></div>

<script>
  let token = localStorage.getItem("socks5_token");
  const socket = io();

  if (token) {
    document.getElementById("loginOverlay").style.display = "none";
    loadStats();
  }

  function logout() {
    localStorage.removeItem("socks5_token");
    location.reload();
  }

  async function doLogin() {
    const username = document.getElementById("loginUser").value;
    const password = document.getElementById("loginPass").value;
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      token = data.access_token;
      localStorage.setItem("socks5_token", token);
      document.getElementById("loginOverlay").style.display = "none";
      loadStats();
    } else {
      document.getElementById("loginError").textContent = "Invalid credentials";
    }
  }

  async function loadStats() {
    const res = await fetch("/api/dashboard/stats", {
      headers: { "Authorization": "Bearer " + token }
    });
    if (res.status === 401) {
      localStorage.removeItem("socks5_token");
      location.reload();
      return;
    }
    const data = await res.json();
    renderStats(data);
  }

  function renderStats(data) {
    document.getElementById("statIP").textContent = data.public_ip;
    document.getElementById("statPort").textContent = data.port;
    document.getElementById("statUsers").textContent = data.total_users;
    document.getElementById("statBlocked").textContent = data.blocked_ips;
    document.getElementById("statusText").textContent = "Server Online";

    // Users table
    const tbody = document.getElementById("usersTable");
    tbody.innerHTML = "";
    data.proxy_users.forEach(u => {
      tbody.innerHTML += `
        <tr>
          <td>${u.username}</td>
          <td><span class="badge ${u.is_active ? 'badge-green' : 'badge-red'}">${u.is_active ? 'Active' : 'Disabled'}</span></td>
          <td><span class="badge ${u.active_connections > 0 ? 'badge-blue' : ''}">${u.active_connections}</span></td>
          <td style="display:flex;gap:6px;">
            <button class="btn btn-warning btn-sm" onclick="toggleUser(${u.id})">Toggle</button>
            <button class="btn btn-primary btn-sm" onclick="rotateUser(${u.id})">Rotate</button>
            <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">Del</button>
          </td>
        </tr>`;
    });

    // Proxy strings
    const ps = document.getElementById("proxyStrings");
    ps.innerHTML = "";
    data.proxy_users.filter(u => u.is_active).forEach(u => {
      ps.innerHTML += `
        <div style="margin-bottom:8px;">
          <div style="font-size:11px;color:#94a3b8;margin-bottom:4px;">${u.username}</div>
          <div class="proxy-string">
            <span>${u.proxy_string}</span>
            <button class="copy-btn" onclick="copyText('${u.proxy_string}')">📋 Copy</button>
          </div>
        </div>`;
    });

    // Events
    const log = document.getElementById("eventLog");
    log.innerHTML = "";
    data.recent_events.forEach(e => appendEvent(e));
  }

  function appendEvent(e) {
    const log = document.getElementById("eventLog");
    const cls = e.event_type === "rotation" ? "event-rotation"
               : e.event_type === "block" ? "event-block" : "event-connect";
    const time = new Date(e.created_at).toLocaleTimeString();
    log.innerHTML = `<div class="event-item"><span class="event-time">${time}</span><span class="${cls}">${e.message}</span></div>` + log.innerHTML;
  }

  async function addUser(event) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = "Adding...";
    try {
      const res = await fetch("/api/users/", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({})
      });
      const data = await res.json();
      loadStats();
      showToast(`User added! Port: ${data.port}`);
    } finally {
      btn.disabled = false;
      btn.textContent = "+ Add User";
    }
  }

  async function toggleUser(id) {
    await fetch(`/api/users/${id}/toggle`, { method: "PATCH", headers: { "Authorization": "Bearer " + token } });
    loadStats();
  }

  async function rotateUser(id) {
    await fetch(`/api/users/${id}/rotate`, { method: "POST", headers: { "Authorization": "Bearer " + token } });
    loadStats();
    showToast("Credentials rotated!");
  }

  async function deleteUser(id) {
    if (!confirm("Delete this user?")) return;
    await fetch(`/api/users/${id}`, { method: "DELETE", headers: { "Authorization": "Bearer " + token } });
    loadStats();
    showToast("User deleted!");
  }

  function copyText(text) {
    navigator.clipboard.writeText(text);
    showToast("Copied to clipboard!");
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2500);
  }

  // WebSocket events
  socket.on("connect", () => {
    document.getElementById("statusDot").style.background = "#22c55e";
    document.getElementById("statusText").textContent = "Server Online";
  });

  socket.on("disconnect", () => {
    document.getElementById("statusDot").style.background = "#ef4444";
    document.getElementById("statusText").textContent = "Disconnected";
  });

  socket.on("security_alert", (data) => {
    const banner = document.getElementById("alertBanner");
    banner.textContent = "⚠️ SECURITY: " + data.message;
    banner.style.display = "block";
    setTimeout(() => banner.style.display = "none", 10000);
    loadStats();
  });

  socket.on("credentials_rotated", (data) => {
    showToast("Credentials rotated for " + data.username);
    loadStats();
  });

  socket.on("connection_update", () => loadStats());

  // Auto-refresh every 15s
  setInterval(loadStats, 15000);
</script>
</body>
</html>
